<svg width="600" height="580" viewBox="0 0 600 580" xmlns="http://www.w3.org/2000/svg">
  <style>
    :root {
      --pill-fill: #17161C;
      --pill-stroke: #2B2A33;
      --label-color: #8B8996;
      --value-color: #F1F0F4;
      --accent: #9B8AFB;
      --accent-dim: #9B8AFB66;
    }
    .glow { animation: breathe 4s ease-in-out infinite; }
    @keyframes breathe {
      0%, 100% { opacity: 0.12; }
      50% { opacity: 0.28; }
    }
    .icon-group { transform-origin: 32.5px 29.5px; animation: spin 9s linear infinite; }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .value { opacity: 0; animation: cycle 18s infinite; }
    @keyframes cycle {
      0%   { opacity: 0; }
      3%   { opacity: 1; }
      13%  { opacity: 1; }
      17%  { opacity: 0; }
      100% { opacity: 0; }
    }
    .v1 { animation-delay: 0s; }
    .v2 { animation-delay: 3s; }
    .v3 { animation-delay: 6s; }
    .v4 { animation-delay: 9s; }
    .v5 { animation-delay: 12s; }
    .v6 { animation-delay: 15s; }
  </style>

  <defs>
    <linearGradient id="vWash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FFD9C2" stop-opacity="0.35"/>
      <stop offset="45%"  stop-color="#D6E4FF" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#E7D9FF" stop-opacity="0.35"/>
    </linearGradient>
    <radialGradient id="blobA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD9C2" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FFD9C2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D6E4FF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#D6E4FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobC" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E7D9FF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#E7D9FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="softBlur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="600" height="580" fill="url(#vWash)"/>

  <g filter="url(#softBlur)">
    <circle cx="160" cy="90" r="190" fill="url(#blobA)"/>
    <circle cx="460" cy="270" r="210" fill="url(#blobB)"/>
    <circle cx="230" cy="470" r="210" fill="url(#blobC)"/>
  </g>

  <g transform="translate(40, 240)">
    <ellipse class="glow" cx="260" cy="30" rx="240" ry="32" fill="var(--accent)"/>

    <g>
      <rect x="0" y="0" width="520" height="60" rx="30" fill="var(--pill-fill)" stroke="var(--pill-stroke)"/>

      <g class="icon-group">
        <rect x="24" y="21" width="7" height="7" rx="2" fill="var(--accent)" opacity="1"/>
        <rect x="34" y="21" width="7" height="7" rx="2" fill="var(--accent)" opacity="0.65"/>
        <rect x="24" y="31" width="7" height="7" rx="2" fill="var(--accent)" opacity="0.4"/>
        <rect x="34" y="31" width="7" height="7" rx="2" fill="var(--accent)" opacity="0.8"/>
      </g>

      <text x="54" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="600" letter-spacing="1.6" fill="var(--label-color)">CURRENTLY</text>

      <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="var(--value-color)">
        <text class="value v1" x="54" y="44">Building NyaySetu</text>
        <text class="value v2" x="54" y="44">Learning DSA</text>
        <text class="value v3" x="54" y="44">Working on Computer Vision</text>
        <text class="value v4" x="54" y="44">Exploring Machine Learning</text>
        <text class="value v5" x="54" y="44">Building software projects</text>
        <text class="value v6" x="54" y="44">Always learning</text>
      </g>
    </g>
  </g>
</svg>
